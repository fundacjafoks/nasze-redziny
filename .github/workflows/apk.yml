name: Zbuduj APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [index.html]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Projekt aplikacji
        run: |
          mkdir apk && cd apk
          cat > package.json <<'EOF'
          {"name":"nasze-redziny","version":"1.0.0","private":true,
           "dependencies":{"@capacitor/android":"^6.2.0","@capacitor/cli":"^6.2.0","@capacitor/core":"^6.2.0"}}
          EOF
          cat > capacitor.config.json <<'EOF'
          {"appId":"pl.fundacjafoks.nasze.redziny","appName":"Nasze Rędziny","webDir":"www",
           "plugins":{"CapacitorHttp":{"enabled":true}}}
          EOF
          mkdir www
          cp ../index.html www/index.html
          sed -i 's#fetch("news.json?"#fetch("https://fundacjafoks.github.io/nasze-redziny/news.json?"#' www/index.html
          npm install
          npx cap add android
          npx cap sync android
      - name: Buduj
        run: cd apk/android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Wydanie
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest -y --cleanup-tag || true
          gh release create apk-latest apk/android/app/build/outputs/apk/debug/app-debug.apk \
            --title "Nasze Rędziny (APK)" --notes "Wersja testowa"
